openapi: 3.0.3
info:
  title: NeetoPlaydash APIs
  version: 1.0.0
  description: APIs to read projects, runs, test entities, result histories, traces and top errors from NeetoPlaydash.
servers:
  - description: NeetoPlaydash APIs
    url: https://{your-subdomain}.neetoplaydash.com/api/external/v1
    variables:
      your-subdomain:
        default: spinkart
        description: Replace **spinkart** with your [workspace's subdomain](/api/workspace-subdomain).
tags:
  - name: Projects
    description: APIs to list projects in the workspace.
  - name: Insights
    description: APIs to fetch a project's aggregated run and test insights over a date range.
  - name: Runs
    description: APIs to list runs and fetch a run with its specs.
  - name: Test Entities
    description: APIs to list test entities and fetch a test entity with its outcomes.
  - name: Result Histories
    description: APIs to fetch the historical results of a test entity.
  - name: Traces
    description: APIs to fetch Playwright traces for a run or a test entity.
  - name: Top Errors
    description: APIs to fetch a run's top errors, with the failing tests grouped by their shared error log.
paths:
  /projects:
    get:
      summary: List projects
      operationId: listProjects
      tags:
        - Projects
      description: List projects in the workspace.
      parameters:
        - $ref: '#/components/parameters/api_key_header'
        - $ref: '#/components/parameters/accept_header'
        - $ref: '#/components/parameters/page_number_param'
        - $ref: '#/components/parameters/page_size_param'
      responses:
        '200':
          description: OK - Request succeeded. Defaults to 15 projects per page (maximum 50).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/project_list_response'
  /projects/{project_id}/insights:
    get:
      summary: Get project insights
      operationId: getProjectInsights
      tags:
        - Insights
      description: |
        Get a project's aggregated run and test insights over a date range, bucketed by day.

        Insights cover the most recent 3 months. A `start_date` older than that is refused with a
        400 rather than clamped, while an `end_date` in the future is clamped to today. Omitting
        both returns the last 30 days.

        A day on which the project recorded nothing is still present in the response, carrying only
        its `date`.
      parameters:
        - $ref: '#/components/parameters/api_key_header'
        - $ref: '#/components/parameters/accept_header'
        - $ref: '#/components/parameters/project_id_param'
        - in: query
          name: start_date
          description: Start of the range as an ISO date. Defaults to 29 days before the end date. Must fall within the most recent 3 months.
          required: false
          schema:
            type: string
            format: date
            example: '2026-07-15'
        - in: query
          name: end_date
          description: End of the range as an ISO date. Defaults to today. A date in the future is clamped to today.
          required: false
          schema:
            type: string
            format: date
            example: '2026-08-13'
        - in: query
          name: branch
          description: Count only runs on this branch.
          required: false
          schema:
            type: string
            example: main
        - in: query
          name: author
          description: Count only runs by this author.
          required: false
          schema:
            type: string
            example: Oliver Smith
        - in: query
          name: tags
          description: Count only runs carrying every listed tag. Accepts a comma-separated list.
          required: false
          style: form
          explode: false
          schema:
            type: array
            items:
              type: string
            example:
              - nightly
              - smoke
        - in: query
          name: timezone
          description: IANA timezone used to bucket days and resolve the date defaults. Defaults to `Etc/UTC`.
          required: false
          schema:
            type: string
            example: America/New_York
      responses:
        '200':
          description: OK - Request succeeded. The response reports the effective `start_date` and `end_date` after clamping.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/insight_response'
        '400':
          description: Bad request - The date range or timezone could not be used.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: A human-readable error message.
              examples:
                beyond_lookback:
                  summary: Start date older than the 3 month window
                  value:
                    error: Insights are available only for the most recent 3 months. Use a date range starting on or after 2026-05-13.
                invalid_date_range:
                  summary: Unparseable date, or a start after the end
                  value:
                    error: Invalid date range format
                invalid_timezone:
                  summary: Unrecognised timezone
                  value:
                    error: 'Unrecognised timezone: ''Mars/Olympus''. Use a valid IANA timezone name such as ''America/New_York''.'
  /projects/{project_id}/runs:
    get:
      summary: List runs
      operationId: listRuns
      tags:
        - Runs
      description: List runs for a project.
      parameters:
        - $ref: '#/components/parameters/api_key_header'
        - $ref: '#/components/parameters/accept_header'
        - $ref: '#/components/parameters/project_id_param'
        - in: query
          name: branch
          description: Filter runs by branch name.
          required: false
          schema:
            type: string
            example: main
        - in: query
          name: status
          description: Filter runs by status.
          required: false
          schema:
            $ref: '#/components/schemas/run_status'
        - $ref: '#/components/parameters/page_number_param'
        - $ref: '#/components/parameters/page_size_param'
      responses:
        '200':
          description: OK - Request succeeded. Defaults to 15 runs per page (maximum 50).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/run_list_response'
  /projects/{project_id}/runs/{run_id}:
    get:
      summary: Get run
      operationId: getRun
      tags:
        - Runs
      description: Get a run along with its specs and the tests grouped under each spec.
      parameters:
        - $ref: '#/components/parameters/api_key_header'
        - $ref: '#/components/parameters/accept_header'
        - $ref: '#/components/parameters/project_id_param'
        - $ref: '#/components/parameters/run_id_param'
        - in: query
          name: status
          description: Filter the returned tests by status. Only specs that contain at least one matching test are returned.
          required: false
          schema:
            type: string
            enum:
              - passed
              - failed
              - skipped
              - interrupted
              - timed_out
              - flaky
            example: failed
        - in: query
          name: page
          description: Page of specs to retrieve, starting from 1. Defaults to 1 when omitted.
          required: false
          schema:
            type: integer
            example: 1
        - $ref: '#/components/parameters/page_size_param'
      responses:
        '200':
          description: OK - Request succeeded. Specs are paginated with a default of 30 per page (maximum 100).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/run_detail_response'
  /projects/{project_id}/runs/{run_id}/test_entities:
    get:
      summary: List test entities
      operationId: listTestEntities
      tags:
        - Test Entities
      description: List test entities (specs or tests) for a run.
      parameters:
        - $ref: '#/components/parameters/api_key_header'
        - $ref: '#/components/parameters/accept_header'
        - $ref: '#/components/parameters/project_id_param'
        - $ref: '#/components/parameters/run_id_param'
        - in: query
          name: kind
          description: Kind of test entity to list. Defaults to `spec`.
          required: false
          schema:
            type: string
            enum:
              - spec
              - test
            default: spec
            example: spec
        - in: query
          name: status
          description: Filter by status. Accepts one or more statuses as a comma-separated list.
          required: false
          style: form
          explode: false
          schema:
            type: array
            items:
              type: string
              enum:
                - passed
                - failed
                - skipped
                - interrupted
                - timed_out
                - flaky
            example:
              - failed
              - flaky
        - $ref: '#/components/parameters/page_number_param'
        - $ref: '#/components/parameters/page_size_param'
      responses:
        '200':
          description: OK - Request succeeded. Defaults to 25 test entities per page (maximum 100).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/test_entity_list_response'
  /projects/{project_id}/runs/{run_id}/test_entities/{test_entity_id}:
    get:
      summary: Get test entity
      operationId: getTestEntity
      tags:
        - Test Entities
      description: Get a test entity along with its outcomes and the attempts (including screenshots, videos, traces and Lighthouse reports) for each outcome.
      parameters:
        - $ref: '#/components/parameters/api_key_header'
        - $ref: '#/components/parameters/accept_header'
        - $ref: '#/components/parameters/project_id_param'
        - $ref: '#/components/parameters/run_id_param'
        - $ref: '#/components/parameters/test_entity_id_param'
      responses:
        '200':
          description: OK - Request succeeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/test_entity_detail_response'
  /projects/{project_id}/runs/{run_id}/test_entities/{test_entity_id}/result_histories:
    get:
      summary: List result histories
      operationId: listResultHistories
      tags:
        - Result Histories
      description: List the historical results of a test entity across previous runs within a look-back window.
      parameters:
        - $ref: '#/components/parameters/api_key_header'
        - $ref: '#/components/parameters/accept_header'
        - $ref: '#/components/parameters/project_id_param'
        - $ref: '#/components/parameters/run_id_param'
        - $ref: '#/components/parameters/test_entity_id_param'
        - in: query
          name: days
          description: Number of days to look back from the anchor date. Defaults to 7.
          required: false
          schema:
            type: integer
            default: 7
            example: 14
        - in: query
          name: result_history_started_at
          description: Anchor date (ISO 8601) to look back from. Defaults to the latest result of the test entity in this run.
          required: false
          schema:
            type: string
            format: date-time
            example: '2026-06-28T00:00:00.000Z'
      responses:
        '200':
          description: OK - Request succeeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/result_history_list_response'
  /projects/{project_id}/runs/{run_id}/traces:
    get:
      summary: List traces
      operationId: listTraces
      tags:
        - Traces
      description: List Playwright traces for a run. Optionally scope the traces to a single test entity.
      parameters:
        - $ref: '#/components/parameters/api_key_header'
        - $ref: '#/components/parameters/accept_header'
        - $ref: '#/components/parameters/project_id_param'
        - $ref: '#/components/parameters/run_id_param'
        - in: query
          name: test_entity_id
          description: Restrict the traces to a single test entity. When omitted, traces for all test entities in the run are returned.
          required: false
          schema:
            type: string
            example: vhrscje
      responses:
        '200':
          description: OK - Request succeeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/trace_list_response'
  /projects/{project_id}/runs/{run_id}/top_errors:
    get:
      summary: List top errors
      operationId: listTopErrors
      tags:
        - Top Errors
      description: List a run's top errors, with the failing tests grouped by their shared error log and ordered by the number of affected tests, most first. For an exhaustive list of failing tests regardless of error, use the [list test entities](/api/test-entities/list) endpoint with a status filter instead.
      parameters:
        - $ref: '#/components/parameters/api_key_header'
        - $ref: '#/components/parameters/accept_header'
        - $ref: '#/components/parameters/project_id_param'
        - $ref: '#/components/parameters/run_id_param'
      responses:
        '200':
          description: OK - Request succeeded. Returns at most 20 error groups, ordered by the number of affected tests.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/top_error_list_response'
components:
  parameters:
    api_key_header:
      in: header
      name: X-Api-Key
      description: Use the X-Api-Key header to provide your workspace API key. Refer to [Authentication](/api/authentication) for more information.
      required: true
      schema:
        type: string
    accept_header:
      in: header
      name: Accept
      description: Specifies the expected response format. Must be set to `application/json` for proper API communication.
      required: true
      schema:
        type: string
        enum:
          - application/json
        default: application/json
    page_number_param:
      in: query
      name: page_number
      description: Page of results to retrieve, starting from 1. Defaults to 1 when omitted.
      required: false
      schema:
        type: integer
        default: 1
        example: 1
    page_size_param:
      in: query
      name: page_size
      description: Number of records returned per page. Each endpoint applies its own default and maximum value.
      required: false
      schema:
        type: integer
        example: 15
    project_id_param:
      in: path
      name: project_id
      description: Id of the project. You can get `project_id` by listing your projects using the [List projects](/api/projects/list) API.
      required: true
      schema:
        type: string
        example: pdqmxlz
    run_id_param:
      in: path
      name: run_id
      description: Id of the run. You can get `run_id` by listing runs using the [List runs](/api/runs/list) API.
      required: true
      schema:
        type: string
        example: kftwnab
    test_entity_id_param:
      in: path
      name: test_entity_id
      description: Id of the test entity (a spec or a test). You can get `test_entity_id` by listing test entities using the [List test entities](/api/test-entities/list) API.
      required: true
      schema:
        type: string
        example: vhrscje
  schemas:
    project:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier of the project.
          example: pdqmxlz
        name:
          type: string
          description: Name of the project.
          example: Spinkart Web
        archived:
          type: boolean
          description: Whether the project has been archived.
          example: false
    pagination:
      type: object
      properties:
        total_records:
          type: integer
          description: Total number of records across all pages.
          example: 42
        total_pages:
          type: integer
          description: Total number of pages available.
          example: 3
        current_page_number:
          type: integer
          description: Current page number.
          example: 1
        page_size:
          type: integer
          description: Number of records per page.
          example: 15
    project_list_response:
      type: object
      properties:
        projects:
          type: array
          items:
            $ref: '#/components/schemas/project'
        pagination:
          $ref: '#/components/schemas/pagination'
    insight_runs_day:
      type: object
      description: Run counts for one day. Only `date` is present on a day the project recorded no passed or failed runs; every other property is omitted for that day.
      properties:
        date:
          type: string
          description: Day the counts belong to, formatted as `%b %e, %Y` in the requested timezone.
          example: Aug 13, 2026
        passed_runs_count:
          type: integer
          description: Runs that passed on this day.
          example: 24
        failed_runs_count:
          type: integer
          description: Runs that failed on this day.
          example: 3
        average_passing_rate:
          type: number
          description: Percentage of this day's runs that passed.
          example: 88.89
        average_run_duration:
          type: number
          description: Average run duration on this day, in milliseconds.
          example: 182450
    insight_runs_overall:
      type: object
      properties:
        passed_runs_count:
          type: integer
          description: Runs that passed across the range.
          example: 612
        failed_runs_count:
          type: integer
          description: Runs that failed across the range.
          example: 88
        average_passing_rate:
          type: number
          description: Percentage of runs in the range that passed.
          example: 87.43
        average_run_duration:
          type: number
          description: Average run duration across the range, in milliseconds.
          example: 176320.5
    insight_runs:
      type: object
      properties:
        runs_volume_data:
          type: array
          description: One entry per day in the range, oldest first.
          items:
            $ref: '#/components/schemas/insight_runs_day'
        overall_data:
          $ref: '#/components/schemas/insight_runs_overall'
    insight_tests_day:
      type: object
      description: Test-result counts for one day. Only `date` is present on a day the project recorded no test results; every other property is omitted for that day.
      properties:
        date:
          type: string
          description: Day the counts belong to, formatted as `%b %e, %Y` in the requested timezone.
          example: Aug 13, 2026
        passed_tests_count:
          type: integer
          description: Tests that passed on this day, flaky ones included.
          example: 1840
        failed_tests_count:
          type: integer
          description: Tests that failed on this day.
          example: 26
        skipped_tests_count:
          type: integer
          description: Tests skipped on this day.
          example: 12
        flaky_tests_count:
          type: integer
          description: Tests that passed on a retry after failing at least once on this day.
          example: 9
        timed_out_tests_count:
          type: integer
          description: Tests that timed out on this day.
          example: 4
        pass_percentage:
          type: number
          description: Percentage of this day's test results that passed.
          example: 97.72
        fail_percentage:
          type: number
          description: Percentage of this day's test results that failed.
          example: 1.38
        skip_percentage:
          type: number
          description: Percentage of this day's test results that were skipped.
          example: 0.64
        flaky_percentage:
          type: number
          description: Percentage of this day's test results that were flaky.
          example: 0.48
        timed_out_percentage:
          type: number
          description: Percentage of this day's test results that timed out.
          example: 0.21
        average_passing_rate:
          type: number
          description: Same value as `pass_percentage`, under the name the runs section uses.
          example: 97.72
        average_flakiness_rate:
          type: number
          description: Same value as `flaky_percentage`, under the name the runs section uses.
          example: 0.48
    insight_tests_overall:
      type: object
      properties:
        passed_tests_count:
          type: integer
          description: Tests that passed across the range, flaky ones included.
          example: 48210
        failed_tests_count:
          type: integer
          description: Tests that failed across the range.
          example: 702
        skipped_tests_count:
          type: integer
          description: Tests skipped across the range.
          example: 318
        flaky_tests_count:
          type: integer
          description: Tests that passed on a retry after failing at least once.
          example: 241
        timed_out_tests_count:
          type: integer
          description: Tests that timed out across the range.
          example: 96
        average_passing_rate:
          type: number
          description: Percentage of tests in the range that passed.
          example: 97.71
        average_flakiness_rate:
          type: number
          description: Percentage of tests in the range that were flaky.
          example: 0.49
    insight_tests:
      type: object
      properties:
        tests_volume_data:
          type: array
          description: One entry per day in the range, oldest first.
          items:
            $ref: '#/components/schemas/insight_tests_day'
        overall_data:
          $ref: '#/components/schemas/insight_tests_overall'
    insight_response:
      type: object
      properties:
        start_date:
          type: string
          format: date
          description: Effective start of the range after clamping, in the requested timezone.
          example: '2026-07-15'
        end_date:
          type: string
          format: date
          description: Effective end of the range after clamping, in the requested timezone.
          example: '2026-08-13'
        timezone:
          type: string
          description: IANA timezone the day buckets and dates are expressed in.
          example: Etc/UTC
        runs:
          $ref: '#/components/schemas/insight_runs'
        tests:
          $ref: '#/components/schemas/insight_tests'
    run_status:
      type: string
      description: Current status of the run.
      enum:
        - running
        - passed
        - failed
        - passing
        - failing
        - timedOut
        - interrupted
      example: passed
    run_statistics:
      type: array
      description: Aggregated count of tests grouped by their status.
      items:
        type: object
        properties:
          name:
            type: string
            description: Humanized status name.
            example: Passed
          value:
            type: integer
            description: Number of tests with this status.
            example: 38
      example:
        - name: Passed
          value: 38
        - name: Failed
          value: 2
        - name: Flaky
          value: 1
    run_base:
      type: object
      properties:
        commit_id:
          type: string
          description: SHA of the commit the run was triggered for.
          example: 9fceb02e1d2c4bb6a1f3f6b0c8e7d5a1b2c3d4e5
        created_at:
          type: string
          format: date-time
          description: Time at which the run was created.
          example: '2026-06-28T09:14:22.000Z'
        commit_name:
          type: string
          description: Commit message associated with the run.
          example: Fix flaky checkout spec
        status:
          $ref: '#/components/schemas/run_status'
        duration:
          type: number
          nullable: true
          description: Total duration of the run in seconds.
          example: 182.45
        ci_build_id:
          type: string
          description: Identifier of the CI build that reported the run.
          example: gh-actions-4821
        branch:
          type: string
          nullable: true
          description: Branch the run was executed on.
          example: main
        author:
          type: string
          nullable: true
          description: Author of the commit.
          example: Oliver Smith
        tags:
          type: array
          description: Tags associated with the run.
          items:
            type: string
          example:
            - smoke
            - nightly
        is_running:
          type: boolean
          description: Whether the run is still in progress.
          example: false
        run_statistics:
          $ref: '#/components/schemas/run_statistics'
    run:
      allOf:
        - type: object
          properties:
            id:
              type: string
              description: Unique identifier of the run.
              example: kftwnab
        - $ref: '#/components/schemas/run_base'
    run_list_response:
      type: object
      properties:
        runs:
          type: array
          items:
            $ref: '#/components/schemas/run'
        pagination:
          $ref: '#/components/schemas/pagination'
    spec_test:
      type: object
      properties:
        test_id:
          type: string
          description: Unique identifier of the test entity.
          example: vhrscje
        title:
          type: string
          description: Title of the test.
          example: adds an item to the cart
        status:
          type: string
          description: Status of the test in this run.
          example: passed
        duration:
          type: number
          nullable: true
          description: Duration of the test in seconds. Omitted when not available.
          example: 3.21
    spec:
      type: object
      properties:
        spec_id:
          type: string
          description: Unique identifier of the spec entity.
          example: wbnxtyz
        file_name:
          type: string
          description: Spec file name.
          example: cart.spec.ts
        tests:
          type: array
          items:
            $ref: '#/components/schemas/spec_test'
    run_detail_response:
      allOf:
        - type: object
          properties:
            project_id:
              type: string
              description: Unique identifier of the project.
              example: pdqmxlz
            run_id:
              type: string
              description: Unique identifier of the run.
              example: kftwnab
        - $ref: '#/components/schemas/run_base'
        - type: object
          properties:
            total_shards:
              type: integer
              nullable: true
              description: Total number of shards configured for the run.
              example: 4
            specs:
              type: array
              description: Specs executed in the run along with their grouped tests.
              items:
                $ref: '#/components/schemas/spec'
            pagination:
              $ref: '#/components/schemas/pagination'
    test_entity:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier of the test entity.
          example: vhrscje
        title:
          type: string
          description: Title of the test entity. For specs this is the file name.
          example: cart.spec.ts
        duration:
          type: number
          nullable: true
          description: Duration of the test entity in seconds.
          example: 12.83
        started_at:
          type: string
          format: date-time
          nullable: true
          description: Time at which the test entity started executing.
          example: '2026-06-28T09:14:25.000Z'
        tests_count:
          type: integer
          description: Number of tests under this entity.
          example: 6
        status:
          type: string
          description: Aggregated status of the test entity.
          example: passed
    test_entity_list_response:
      type: object
      properties:
        test_entities:
          type: array
          items:
            $ref: '#/components/schemas/test_entity'
        pagination:
          $ref: '#/components/schemas/pagination'
    attempt:
      type: object
      properties:
        status:
          type: string
          description: Status of this attempt.
          example: passed
        duration:
          type: number
          nullable: true
          description: Duration of the attempt in seconds.
          example: 3.02
        log:
          type: string
          nullable: true
          description: Playwright's error output for this attempt. Null when the attempt produced none.
          example: 'TimeoutError: locator.click: Timeout 10000ms exceeded.'
        screenshots:
          type: array
          description: URLs of screenshots captured during the attempt.
          items:
            type: string
            format: uri
        videos:
          type: array
          description: URLs of videos captured during the attempt.
          items:
            type: string
            format: uri
        traces:
          type: array
          description: URLs of Playwright traces captured during the attempt.
          items:
            type: string
            format: uri
        lighthouses:
          type: array
          description: URLs of Lighthouse reports captured during the attempt.
          items:
            type: string
            format: uri
    outcome:
      type: object
      properties:
        status:
          type: string
          description: Status of the outcome.
          example: passed
        repeat_each_index:
          type: integer
          nullable: true
          description: Index of the repetition when the test is repeated.
          example: 0
        shard:
          type: integer
          nullable: true
          description: Shard the outcome was executed on.
          example: 1
        is_expected:
          type: boolean
          nullable: true
          description: Whether the outcome matched the expected result.
          example: true
        attempts:
          type: array
          items:
            $ref: '#/components/schemas/attempt'
    contained_test:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier of the test.
          example: vhrscje
        title:
          type: string
          description: Title of the test.
          example: adds an item to the cart
        status:
          type: string
          description: Status the run recorded for this test.
          example: passed
    test_entity_detail_response:
      type: object
      properties:
        title:
          type: string
          description: Title of the test entity.
          example: adds an item to the cart
        describe_path:
          type: array
          description: Ordered list of ancestor describe blocks leading to this test.
          items:
            type: string
          example:
            - Cart
            - when logged in
        status:
          type: string
          description: Aggregated status of the test entity.
          example: passed
        outcomes:
          type: array
          description: Outcomes recorded for this entity in the run. Always empty for a spec, which takes no attempts of its own.
          items:
            $ref: '#/components/schemas/outcome'
        tests:
          type: array
          description: Tests the run recorded inside this entity. Always empty for a test, which contains none.
          items:
            $ref: '#/components/schemas/contained_test'
    result_history_run:
      type: object
      properties:
        commit_name:
          type: string
          description: Commit message associated with the run.
          example: Fix flaky checkout spec
        branch:
          type: string
          nullable: true
          description: Branch the run was executed on.
          example: main
        author:
          type: string
          nullable: true
          description: Author of the commit.
          example: Oliver Smith
        tags:
          type: array
          items:
            type: string
          example:
            - nightly
        commit_id:
          type: string
          description: SHA of the commit.
          example: 9fceb02e1d2c4bb6a1f3f6b0c8e7d5a1b2c3d4e5
        ci_build_id:
          type: string
          description: Identifier of the CI build that reported the run.
          example: gh-actions-4821
        duration:
          type: number
          nullable: true
          description: Total duration of the run in seconds.
          example: 182.45
        status:
          type: string
          description: Status of the run.
          example: passed
    result_history:
      type: object
      properties:
        status:
          type: string
          description: Status of the test entity in this historical run.
          example: passed
        duration:
          type: number
          nullable: true
          description: Duration of the test entity in this run, in seconds.
          example: 3.21
        started_at:
          type: string
          format: date-time
          nullable: true
          description: Time at which this result started.
          example: '2026-06-27T09:14:25.000Z'
        run_id:
          type: string
          description: Unique identifier of the run this result belongs to.
          example: kftwnab
        run:
          $ref: '#/components/schemas/result_history_run'
    result_history_list_response:
      type: object
      properties:
        result_histories:
          type: array
          items:
            $ref: '#/components/schemas/result_history'
    trace:
      type: object
      properties:
        test_entity_id:
          type: string
          description: Unique identifier of the test entity the traces belong to.
          example: vhrscje
        title:
          type: string
          description: Title of the test entity.
          example: adds an item to the cart
        trace_urls:
          type: array
          description: Playwright trace viewer URLs for the captured traces.
          items:
            type: string
            format: uri
          example:
            - https://trace.playwright.dev/?trace=https://cdn.neetoplaydash.com/traces/abc123.zip
    trace_list_response:
      type: object
      properties:
        traces:
          type: array
          items:
            $ref: '#/components/schemas/trace'
    top_error_test_entity:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier of the test entity.
          example: vhrscje
        title:
          type: string
          description: Title of the test.
          example: adds an item to the cart
        spec:
          type: object
          description: The spec file the test belongs to.
          properties:
            id:
              type: string
              description: Unique identifier of the spec.
              example: bhkscfe
            title:
              type: string
              description: Title of the spec.
              example: cart.spec.ts
        project:
          type: string
          description: Title of the project the test belongs to.
          example: spinkart-web
        describe_path:
          type: array
          description: Titles of the describe blocks enclosing the test, outermost first.
          items:
            type: string
          example:
            - Cart
    top_error:
      type: object
      properties:
        count:
          type: integer
          description: Number of tests affected by the error.
          example: 3
        log:
          type: string
          description: The error log the tests are grouped by, without Playwright's per-test `Call log:` section.
          example: 'TimeoutError: locator.click: Timeout 10000ms exceeded.'
        test_entity_ids:
          type: array
          description: Unique identifiers of every test affected by the error.
          items:
            type: string
          example:
            - vhrscje
            - dhkscfj
        test_entities:
          type: array
          description: The affected tests, each with its spec, project, and describe path.
          items:
            $ref: '#/components/schemas/top_error_test_entity'
    top_error_list_response:
      type: object
      properties:
        top_errors:
          type: array
          items:
            $ref: '#/components/schemas/top_error'
